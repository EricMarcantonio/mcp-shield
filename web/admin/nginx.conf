server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This console holds an audit record. Do not let an intermediary keep a
    # copy of the shell, and never cache the runtime configuration — the whole
    # point of config.js is that it changes per deployment.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Hashed filenames; safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Included only when API_PROXY_PASS is set; see docker-entrypoint.sh.
    include /etc/nginx/conf.d/api-proxy.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
