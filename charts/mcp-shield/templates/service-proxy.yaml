apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-shield.fullname" . }}-proxy
  labels:
    {{- include "mcp-shield.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - port: {{ .Values.proxy.service.port }}
      targetPort: proxy
      protocol: TCP
      name: proxy
  selector:
    {{- include "mcp-shield.selectorLabels" . | nindent 4 }}
