name: release

# Triggered by pushing a `vX.Y.Z` tag. GoReleaser reads .goreleaser.yaml,
# cross-compiles cmd/mcp-shield for 6 platforms (CGO_ENABLED=0 works because
# the only dependency, modernc.org/sqlite, is pure Go), publishes a GitHub
# Release with archives + checksums, and builds/pushes a multi-arch Docker
# image to ghcr.io/ericmarcantonio/mcp-shield.
#
# PRIVATE REPO NOTE: as of this workflow's introduction, this repository is
# private. Pushing to GHCR with GITHUB_TOKEN still works from a private repo,
# but the resulting package inherits the repo's visibility: nobody can
# `docker pull` it, and `go install .../cmd/mcp-shield@vX.Y.Z` won't resolve
# for anyone outside the repo's collaborators, until (a) the repo is made
# public and (b) the GHCR package's own visibility is separately flipped to
# public in GitHub package settings (that second step is manual — package
# visibility does not automatically follow repo visibility). Nothing below
# needs to change when that happens; this note documents the dependency, it
# does not gate the workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload archives/checksums
  packages: write # push images/manifests to ghcr.io
  id-token: write # OIDC token used to sign build provenance
  attestations: write # record SLSA provenance attestations

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full history to build the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser already fails this job (non-zero exit) if a docker build or
      # push errors out — but a job that goes red *after* the GitHub Release
      # and its archives are already published looks, at a glance, like a
      # finished release. Explicitly re-checking that every image manifest
      # this tag should have produced actually exists in the registry turns
      # "half-published" into a loud, unambiguous failure instead of
      # something that has to be noticed by reading logs.
      - name: Verify published Docker manifests exist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for tag in "$version" "$version-amd64" "$version-arm64" latest; do
            echo "Checking ghcr.io/ericmarcantonio/mcp-shield:$tag"
            docker buildx imagetools inspect "ghcr.io/ericmarcantonio/mcp-shield:$tag"
          done

      # SLSA build provenance. A gateway that exists to tell you an artifact
      # changed should be able to prove where its own artifacts came from.
      # These attestations are verifiable with:
      #   gh attestation verify <file-or-oci-ref> --repo EricMarcantonio/mcp-shield
      # Build provenance cannot be persisted for user-owned PRIVATE repos --
      # the API returns "Feature not available for user-owned private
      # repositories". Skipping rather than failing keeps a private-repo
      # release whole; the moment this repo is public the condition flips and
      # attestation happens with no edit here.
      - name: Attest release binaries
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Packages charts/mcp-shield and pushes it as an OCI artifact to GHCR,
  # right alongside the Docker image this same tag already publishes.
  # OCI rather than a GitHub Pages `helm repo add`-style index: GHCR is
  # already the registry this workflow authenticates to with GITHUB_TOKEN
  # (see the goreleaser job above), so this reuses that trust boundary
  # instead of standing up a second, differently-authenticated publishing
  # path just for chart artifacts. `helm install
  # oci://ghcr.io/ericmarcantonio/charts/mcp-shield --version X.Y.Z` needs
  # no `helm repo add` step first, unlike a Pages-hosted index.
  #
  # Runs after `goreleaser`, not in parallel with it: the chart's
  # `image.tag` default resolves to `Chart.appVersion`, i.e. this exact
  # tag, so publishing the chart before the image it points at exists
  # would let an install briefly resolve to a nonexistent image tag.
  helm-chart:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      packages: write # push the chart OCI artifact to ghcr.io
      id-token: write # OIDC token used to sign the chart's provenance attestation
      attestations: write # record the chart's SLSA provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      # Chart.yaml's `version`/`appVersion` fields are a placeholder
      # (0.0.0-placeholder) checked into the repo -- `helm package
      # --version --app-version` overrides both at pack time from the
      # same $GITHUB_REF_NAME that triggered this workflow, so the chart
      # version, the app version it deploys, and the git tag can never
      # drift apart from each other. Nothing in charts/mcp-shield/Chart.yaml
      # needs hand-editing for a release.
      - name: Package chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm lint charts/mcp-shield
          helm package charts/mcp-shield \
            --version "$version" \
            --app-version "$version" \
            --destination dist-chart

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Push chart to GHCR
        run: |
          set -euo pipefail
          helm push dist-chart/mcp-shield-*.tgz oci://ghcr.io/ericmarcantonio/charts

      - name: Attest chart provenance
        if: ${{ !github.event.repository.private }} # see note in the goreleaser job
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist-chart/mcp-shield-*.tgz
