{{- include "mcp-shield.assertSingleReplica" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-shield.fullname" . }}
  labels:
    {{- include "mcp-shield.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not the apps/v1 default RollingUpdate: this pod is the only
  # writer of a single SQLite file on an RWO PVC. RollingUpdate briefly
  # runs the old and new pod side by side, which either fails to schedule
  # the new pod (the PVC is still attached to the old pod's node) or --
  # worse, on a CSI driver/access mode that permits multi-attach -- lets
  # two processes open the same database file at once. Recreate guarantees
  # the old pod, and its file handle, is fully gone before the new one
  # starts. This is intentionally not a values.yaml knob: there is no safe
  # alternative to pair with a single SQLite file, so there is nothing for
  # an operator to correctly opt into by changing it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mcp-shield.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-shield.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mcp-shield.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp-shield
          image: {{ include "mcp-shield.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: dashboard
              containerPort: 8081
              protocol: TCP
          env:
            - name: DATABASE_PATH
              value: {{ .Values.database.path | quote }}
            - name: PROXY_ADDR
              value: ":8080"
            - name: API_ADDR
              value: ":8081"
            - name: FAIL_MODE
              value: {{ .Values.env.failMode | quote }}
            - name: CONFIG_PATH
              value: {{ .Values.env.configPath | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: dashboard
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: dashboard
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "mcp-shield.fullname" .)) }}
          {{- else }}
          # persistence.enabled: false -- the audit trail lives only as
          # long as this pod does. Every restart/reschedule starts from an
          # empty database, which means every server has to be re-approved
          # from scratch. Only appropriate for a disposable demo.
          emptyDir: {}
          {{- end }}
        - name: config
          {{- if eq .Values.config.type "configmap" }}
          configMap:
            name: {{ include "mcp-shield.configObjectName" . }}
          {{- else }}
          secret:
            secretName: {{ include "mcp-shield.configObjectName" . }}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
