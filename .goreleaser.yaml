version: 2
project_name: mcp-shield

before:
  hooks:
    - go mod tidy

builds:
  # Only the mcp-shield binary is a release artifact. cmd/mcp-shield-testserver
  # is a test fixture used by `make build`/manual testing, not something an
  # end user installs; it is deliberately left out of releases and images.
  - id: mcp-shield
    main: ./cmd/mcp-shield
    binary: mcp-shield
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go; this is what makes cross-compilation config-only
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - web/**/*
      - config/*.example.json

checksum:
  name_template: checksums.txt

changelog:
  use: github

# The org.opencontainers.image.source label is what links the published
# package to this repository on GHCR: without it the package never appears in
# the repo's Packages sidebar and does not inherit the repo's access
# permissions. Package *visibility* is still a separate, web-UI-only toggle --
# GitHub exposes no API for it -- so a freshly published package stays private
# until someone flips it by hand once.
dockers:
  - goarch: amd64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - ghcr.io/ericmarcantonio/mcp-shield:{{ .Version }}-amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.source=https://github.com/EricMarcantonio/mcp-shield
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=Zero Trust gateway for the Model Context Protocol
      - --label=org.opencontainers.image.url=https://github.com/EricMarcantonio/mcp-shield
      - --label=org.opencontainers.image.documentation=https://github.com/EricMarcantonio/mcp-shield#readme
      - --label=org.opencontainers.image.licenses=Apache-2.0
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}
    extra_files: [web]
  - goarch: arm64
    dockerfile: Dockerfile.goreleaser
    image_templates:
      - ghcr.io/ericmarcantonio/mcp-shield:{{ .Version }}-arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.source=https://github.com/EricMarcantonio/mcp-shield
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=Zero Trust gateway for the Model Context Protocol
      - --label=org.opencontainers.image.url=https://github.com/EricMarcantonio/mcp-shield
      - --label=org.opencontainers.image.documentation=https://github.com/EricMarcantonio/mcp-shield#readme
      - --label=org.opencontainers.image.licenses=Apache-2.0
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .Date }}
    extra_files: [web]

docker_manifests:
  - name_template: ghcr.io/ericmarcantonio/mcp-shield:{{ .Version }}
    image_templates:
      - ghcr.io/ericmarcantonio/mcp-shield:{{ .Version }}-amd64
      - ghcr.io/ericmarcantonio/mcp-shield:{{ .Version }}-arm64
  - name_template: ghcr.io/ericmarcantonio/mcp-shield:latest
    image_templates:
      - ghcr.io/ericmarcantonio/mcp-shield:{{ .Version }}-amd64
      - ghcr.io/ericmarcantonio/mcp-shield:{{ .Version }}-arm64
