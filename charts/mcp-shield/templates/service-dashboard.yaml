{{/*
The approval API + dashboard Service. Defaults to ClusterIP (see
values.yaml `dashboard.service.type` for the full warning): :8081 has no
authentication of any kind, so widening this to NodePort/LoadBalancer is a
values.yaml edit an operator has to make deliberately, next to a comment
that says exactly what they're opting into, not a one-line change made
without context. Ingress, the other path to external reachability, is
handled by templates/ingress.yaml and is disabled by default too.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-shield.fullname" . }}-dashboard
  labels:
    {{- include "mcp-shield.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: dashboard
      protocol: TCP
      name: dashboard
  selector:
    {{- include "mcp-shield.selectorLabels" . | nindent 4 }}
