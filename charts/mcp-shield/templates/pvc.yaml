{{/*
Only rendered when persistence is enabled and the operator hasn't pointed
us at a PVC they already manage. Deliberately not a StatefulSet
volumeClaimTemplate -- there is exactly one SQLite file for the whole
release (see values.yaml `replicaCount`), so one plain PVC referenced by
the Deployment's pod template is the right shape, not one-per-replica.
*/}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcp-shield.fullname" . }}-data
  labels:
    {{- include "mcp-shield.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
